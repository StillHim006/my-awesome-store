<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Feedback - Exam Prep</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="exam-prep.html">Exam Prep</a>
        <a href="new.html">Management</a>
        <a href="suggestions.html">Suggestions</a>
        <a href="feedback.html" class="active">Submit Feedback</a>
        <a href="ratings-view.html">View Ratings</a>
        <a href="suggestions-view.html">View Suggestions</a>
    </nav>

    <main class="container">
        <div class="glass-card">
            <h1>We'd love your feedback</h1>
            <p>Tell us how we're doing and how we can improve.</p>

            <form id="feedbackForm">
                <div class="form-group">
                    <label>Your Name (Optional)</label>
                    <input type="text" id="name" placeholder="Anonymous">
                </div>

                <div class="form-group">
                    <label>Rating (Required)</label>
                    <div class="star-rating">
                        <input type="radio" name="rating" id="star5" value="5" required><label for="star5">★</label>
                        <input type="radio" name="rating" id="star4" value="4"><label for="star4">★</label>
                        <input type="radio" name="rating" id="star3" value="3"><label for="star3">★</label>
                        <input type="radio" name="rating" id="star2" value="2"><label for="star2">★</label>
                        <input type="radio" name="rating" id="star1" value="1"><label for="star1">★</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Comment (Optional)</label>
                    <textarea id="comment" rows="4" placeholder="Share your experience..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Feedback</button>
            </form>

            <div id="successMessage" class="hidden text-center mt-4">
                <div style="font-size: 3rem; color: var(--success);">✓</div>
                <h2>Thank You!</h2>
                <p>Your feedback has been submitted successfully.</p>
                <button onclick="resetForm()" class="btn btn-primary">Submit Another</button>
            </div>

            <div id="errorMessage" class="hidden text-center mt-4" style="color: var(--error);">
                <p>Something went wrong. Please check your internet connection and try again.</p>
            </div>
        </div>
    </main>

    <script>
        // REPLACE THIS WITH YOUR DEPLOYED APPS SCRIPT URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby13HqjWnm0zcrlfCzFdOIoDtBX6CrZewvSfKU8UXcen-6jFpA8w8JQdbA8kvNIAOc6Rg/exec';

        const form = document.getElementById('feedbackForm');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (SCRIPT_URL.includes('YOUR_DEPLOYED_ID')) {
                alert('Please update the SCRIPT_URL in feedback.html with your deployed Apps Script URL.');
                return;
            }

            const formData = {
                type: 'feedback',
                name: document.getElementById('name').value,
                rating: document.querySelector('input[name="rating"]:checked').value,
                comment: document.getElementById('comment').value
            };

            const submitBtn = form.querySelector('button');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            try {
                // Using no-cors mode as requested
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                // Since no-cors doesn't allow reading the response, we assume success if no error is thrown
                form.classList.add('hidden');
                successMessage.classList.remove('hidden');
                errorMessage.classList.add('hidden');
            } catch (error) {
                console.error('Error:', error);
                errorMessage.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Feedback';
            }
        });

        function resetForm() {
            form.reset();
            form.classList.remove('hidden');
            successMessage.classList.add('hidden');
            errorMessage.classList.add('hidden');
        }
    </script>
</body>
</html>
