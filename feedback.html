<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | Exam Prep Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 2rem;
        }

        h1 {
            color: #1e293b;
            margin-bottom: 0.5rem;
        }

        .sub {
            color: #475569;
            margin-bottom: 2rem;
            border-left: 4px solid #4f46e5;
            padding-left: 1rem;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #e2e8f0;
        }

        .nav-links a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            transition: background 0.2s;
        }

        .nav-links a:hover {
            background: #e0e7ff;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 0.5rem;
            color: #1e293b;
        }

        input, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 1rem;
            font-family: inherit;
            font-size: 1rem;
            margin-bottom: 1.2rem;
        }

        .rating-section {
            margin-bottom: 1.5rem;
        }

        .stars {
            display: flex;
            gap: 0.5rem;
            font-size: 2rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .star {
            color: #cbd5e1;
            transition: color 0.2s;
        }

        .star.selected {
            color: #fbbf24;
        }

        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #4338ca;
        }

        .alert {
            background: #dcfce7;
            color: #166534;
            padding: 0.75rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
        }

        .alert.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .footer-link {
            margin-top: 2rem;
            text-align: center;
        }

        .footer-link a {
            display: inline-block;
            background: #f1f5f9;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            text-decoration: none;
            color: #1e293b;
            font-weight: 500;
        }

        .optional {
            font-size: 0.8rem;
            color: #64748b;
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="nav-links">
        <a href="index.html">🏠 Home</a>
        <a href="exam-prep.html">📖 Exam Prep</a>
        <a href="suggestions.html">💡 Suggestions</a>
        <a href="ratings-view.html">⭐ Ratings</a>
    </div>
    <h1>📝 We value your feedback</h1>
    <div class="sub">Rate your experience – it helps us improve!</div>

    <div id="alertMessage" style="display: none;" class="alert"></div>

    <div>
        <label for="name">Your name <span class="optional">(optional)</span></label>
        <input type="text" id="name" placeholder="e.g., Ahmed, or leave blank for anonymous">
    </div>

    <div class="rating-section">
        <label>Your rating:</label>
        <div class="stars" id="starContainer">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
        </div>
    </div>

    <div>
        <label for="comment">Your comment <span class="optional">(optional)</span></label>
        <textarea id="comment" rows="4" placeholder="Share your thoughts..."></textarea>
    </div>

    <button id="submitFeedback">Submit Feedback</button>

    <div class="footer-link">
        <a href="ratings-view.html">⭐ View all ratings</a>
    </div>
</div>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyyavLM1NTgdw-tpjrjSI8uwG3jUlRweI2jrwqI6LZJl9e01gwyOczBx1GC9KvDJAU0/exec"; // replace with your URL
    let selectedRating = 0;

    const stars = document.querySelectorAll('.star');
    stars.forEach(star => {
        star.addEventListener('click', () => {
            selectedRating = parseInt(star.getAttribute('data-value'));
            stars.forEach(s => {
                const val = parseInt(s.getAttribute('data-value'));
                if (val <= selectedRating) s.classList.add('selected');
                else s.classList.remove('selected');
            });
        });
    });

    function showAlert(message, isError = false) {
        const alertDiv = document.getElementById('alertMessage');
        alertDiv.textContent = message;
        alertDiv.className = isError ? 'alert error' : 'alert';
        alertDiv.style.display = 'block';
        setTimeout(() => {
            alertDiv.style.display = 'none';
        }, 3000);
    }

    document.getElementById('submitFeedback').addEventListener('click', async () => {
        if (selectedRating === 0) {
            showAlert('Please select a rating (1–5 stars).', true);
            return;
        }
        const name = document.getElementById('name').value.trim();
        const comment = document.getElementById('comment').value.trim();
        const payload = { name, rating: selectedRating, comment };

        try {
            await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            showAlert('Thank you for your feedback!', false);
            document.getElementById('name').value = '';
            selectedRating = 0;
            stars.forEach(s => s.classList.remove('selected'));
            document.getElementById('comment').value = '';
        } catch (err) {
            showAlert('Error submitting feedback. Please try again.', true);
        }
    });
</script>
</body>
</html>
