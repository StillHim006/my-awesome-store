<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Ratings - Exam Prep</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="exam-prep.html">Exam Prep</a>
        <a href="new.html">Management</a>
        <a href="suggestions.html">Suggestions</a>
        <a href="feedback.html">Submit Feedback</a>
        <a href="ratings-view.html" class="active">View Ratings</a>
        <a href="suggestions-view.html">View Suggestions</a>
    </nav>

    <main class="container">
        <div class="glass-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1>Community Ratings</h1>
                <button onclick="fetchRatings()" class="btn btn-primary" id="refreshBtn">Refresh</button>
            </div>

            <div id="loading" class="text-center">
                <p>Loading feedback...</p>
            </div>

            <div id="ratingsContainer" class="rating-grid">
                <!-- Ratings will be injected here -->
            </div>

            <div id="emptyMessage" class="hidden text-center mt-4">
                <p>No ratings yet. Be the first to share your feedback!</p>
                <a href="feedback.html" class="btn btn-primary mt-4">Submit Feedback</a>
            </div>
        </div>
    </main>

    <script>
        // REPLACE THIS WITH YOUR DEPLOYED APPS SCRIPT URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby13HqjWnm0zcrlfCzFdOIoDtBX6CrZewvSfKU8UXcen-6jFpA8w8JQdbA8kvNIAOc6Rg/exec';

        async function fetchRatings() {
            const container = document.getElementById('ratingsContainer');
            const loading = document.getElementById('loading');
            const emptyMessage = document.getElementById('emptyMessage');
            const refreshBtn = document.getElementById('refreshBtn');

            if (SCRIPT_URL.includes('YOUR_DEPLOYED_ID')) {
                loading.innerHTML = '<p style="color: var(--error);">Please update SCRIPT_URL in ratings-view.html</p>';
                return;
            }

            refreshBtn.disabled = true;
            refreshBtn.textContent = 'Updating...';
            loading.classList.remove('hidden');
            container.innerHTML = '';
            emptyMessage.classList.add('hidden');

            try {
                const response = await fetch(SCRIPT_URL + '?type=feedback');
                const csvData = await response.text();
                
                const rows = parseCSV(csvData);
                
                // Remove header row and reverse to show newest first
                const data = rows.slice(1).reverse();

                if (data.length === 0) {
                    emptyMessage.classList.remove('hidden');
                } else {
                    data.forEach(row => {
                        if (row.length < 3) return; // Skip invalid rows
                        
                        const [timestamp, name, rating, comment] = row;
                        const card = createRatingCard(timestamp, name, rating, comment);
                        container.appendChild(card);
                    });
                }
            } catch (error) {
                console.error('Error fetching ratings:', error);
                loading.innerHTML = '<p style="color: var(--error);">Error loading feedback. Please try again later.</p>';
            } finally {
                loading.classList.add('hidden');
                refreshBtn.disabled = false;
                refreshBtn.textContent = 'Refresh';
            }
        }

        function parseCSV(text) {
            const result = [];
            let row = [];
            let col = "";
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (inQuotes) {
                    if (char === '"' && nextChar === '"') {
                        col += '"';
                        i++;
                    } else if (char === '"') {
                        inQuotes = false;
                    } else {
                        col += char;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                    } else if (char === ',') {
                        row.push(col);
                        col = "";
                    } else if (char === '\n') {
                        row.push(col);
                        result.push(row);
                        row = [];
                        col = "";
                    } else if (char !== '\r') {
                        col += char;
                    }
                }
            }
            if (col || row.length > 0) {
                row.push(col);
                result.push(row);
            }
            return result;
        }

        function createRatingCard(timestamp, name, rating, comment) {
            const card = document.createElement('div');
            card.className = 'rating-card';

            const stars = '★'.repeat(parseInt(rating)) + '☆'.repeat(5 - parseInt(rating));

            card.innerHTML = `
                <div class="rating-header">
                    <span class="rating-name">${name || 'Anonymous'}</span>
                    <span class="rating-stars">${stars}</span>
                </div>
                <div class="rating-date">${timestamp}</div>
                <div class="rating-comment">${comment || 'No comment provided.'}</div>
            `;
            return card;
        }

        // Initial fetch
        fetchRatings();
    </script>
</body>
</html>
