<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Ratings | Exam Prep Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 10% 30%, #0a0f1c, #03060c);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #eee;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: rgba(12, 20, 30, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 36px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 28px 24px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 2rem;
            color: #FFD966;
            text-align: center;
        }

        .sub {
            text-align: center;
            color: #9bb8da;
            margin-bottom: 30px;
            border-bottom: 1px solid #2a3a4a;
            padding-bottom: 12px;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #2a3a4a;
        }

        .nav-links a {
            color: #FFDE9E;
            text-decoration: none;
            font-weight: 500;
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            transition: background 0.2s;
        }

        .nav-links a:hover {
            background: rgba(255, 215, 0, 0.2);
            text-decoration: underline;
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 24px;
            gap: 1rem;
        }

        .toolbar button, .toolbar a {
            background: linear-gradient(95deg, #FFC857, #FF9F2E);
            border: none;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.2s;
            color: #1e2a2f;
        }

        .toolbar button:hover, .toolbar a:hover {
            transform: translateY(-2px);
            opacity: 0.92;
            box-shadow: 0 8px 20px rgba(255, 200, 80, 0.3);
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .feedback-card {
            background: rgba(20, 30, 45, 0.7);
            border-left: 5px solid #FFD966;
            border-radius: 20px;
            padding: 20px;
            transition: 0.2s;
        }

        .feedback-card:hover {
            background: rgba(30, 45, 60, 0.8);
            transform: translateX(5px);
        }

        .card-header {
            font-size: 1rem;
            font-weight: bold;
            color: #FFD966;
            margin-bottom: 12px;
            border-bottom: 1px dashed #FFD96680;
            padding-bottom: 6px;
        }

        .stars-rating {
            color: #fbbf24;
            font-size: 1.2rem;
            margin: 8px 0;
        }

        .row {
            margin: 8px 0;
            display: flex;
            flex-wrap: wrap;
        }

        .field-label {
            font-weight: bold;
            min-width: 80px;
            color: #FFDE9E;
        }

        .field-value {
            color: #eef4ff;
            flex: 1;
            word-break: break-word;
        }

        .anonymous {
            color: #aa8866;
            font-style: italic;
        }

        .status-msg {
            text-align: center;
            padding: 40px;
            color: #ffb570;
        }

        footer {
            margin-top: 32px;
            text-align: center;
            font-size: 0.7rem;
            color: #6c8aa0;
            border-top: 1px solid #2a3a4a;
            padding-top: 20px;
        }

        a {
            color: #FFD966;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="nav-links">
        <a href="index.html">🏠 Home</a>
        <a href="exam-prep.html">📖 Exam Prep</a>
        <a href="suggestions.html">💡 Suggestions</a>
        <a href="feedback.html">📝 Feedback</a>
    </div>
    <h1>⭐ User Feedback & Ratings</h1>
    <div class="sub">What our users say about the Exam Prep Hub</div>

    <div class="toolbar">
        <button id="refreshBtn">⟳ Refresh Data</button>
        <a href="feedback.html">+ Submit Feedback</a>
    </div>

    <div id="cardsContainer" class="cards-container">
        <div class="status-msg">Loading feedback...</div>
    </div>

    <footer>📊 Ratings are stored securely in a Google Sheet. Names are optional.</footer>
</div>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-f1HhQJb9Ys97WN_8u6tFLIsEA1zXRzkOHo6q9GgNmCQZ6lB0bIto13WbTxUyJg6K/exec";

    function parseCSV(csvText) {
        const rows = [];
        let currentRow = [], currentField = "", inQuotes = false;
        for (let i = 0; i < csvText.length; i++) {
            const ch = csvText[i];
            if (ch === '"') { inQuotes = !inQuotes; continue; }
            if (ch === ',' && !inQuotes) { currentRow.push(currentField); currentField = ""; continue; }
            if (ch === '\n' && !inQuotes) { currentRow.push(currentField); rows.push(currentRow); currentRow = []; currentField = ""; continue; }
            currentField += ch;
        }
        if (currentField !== "" || currentRow.length) { currentRow.push(currentField); rows.push(currentRow); }
        return rows.map(row => row.map(f => f.trim().replace(/^"(.*)"$/, '$1')));
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function loadFeedback() {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = '<div class="status-msg">⏳ Fetching ratings...</div>';
        try {
            const url = `${APPS_SCRIPT_URL}?t=${Date.now()}`;
            const resp = await fetch(url);
            const csvText = await resp.text();
            const rows = parseCSV(csvText);
            if (!rows || rows.length < 2) {
                container.innerHTML = '<div class="status-msg">📭 No feedback yet. Be the first to rate!</div>';
                return;
            }
            const headers = rows[0];
            const dataRows = rows.slice(1);
            const idxTimestamp = headers.findIndex(h => h.toLowerCase() === 'timestamp');
            const idxName = headers.findIndex(h => h.toLowerCase() === 'name');
            const idxRating = headers.findIndex(h => h.toLowerCase() === 'rating');
            const idxComment = headers.findIndex(h => h.toLowerCase() === 'comment');

            let html = '';
            for (let i = 0; i < dataRows.length; i++) {
                const row = dataRows[i];
                const timestamp = idxTimestamp >= 0 ? row[idxTimestamp] : '';
                let rawName = idxName >= 0 ? row[idxName] : '';
                const name = rawName && rawName.trim() !== '' ? escapeHtml(rawName.trim()) : null;
                const rating = idxRating >= 0 ? row[idxRating] : '';
                const comment = idxComment >= 0 ? row[idxComment] : '';
                const ratingNum = parseInt(rating) || 0;
                const starsFull = '★'.repeat(ratingNum);
                const starsEmpty = '☆'.repeat(5 - ratingNum);
                const starsDisplay = starsFull + starsEmpty;

                html += `
                    <div class="feedback-card">
                        <div class="card-header">📌 Feedback #${dataRows.length - i}</div>
                        <div class="row">
                            <span class="field-label">🕒 Date:</span>
                            <span class="field-value">${escapeHtml(timestamp)}</span>
                        </div>
                        <div class="row">
                            <span class="field-label">👤 Name:</span>
                            <span class="field-value">${name ? name : '<span class="anonymous">Anonymous</span>'}</span>
                        </div>
                        <div class="stars-rating">${starsDisplay} (${ratingNum}/5)</div>
                        <div class="row">
                            <span class="field-label">💬 Comment:</span>
                            <span class="field-value">${comment ? escapeHtml(comment) : '— no comment —'}</span>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        } catch (err) {
            console.error(err);
            container.innerHTML = '<div class="status-msg">⚠️ Failed to load feedback. Please refresh later.</div>';
        }
    }

    document.getElementById('refreshBtn').addEventListener('click', loadFeedback);
    loadFeedback();
</script>
</body>
</html>
