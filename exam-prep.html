<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Prep - Study Center</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .lecture-group {
            margin-bottom: 1.5rem;
            animation: fadeIn 0.5s ease-out;
        }

        .lecture-header {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 1.2rem 1.5rem;
            border-radius: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .lecture-header:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }

        .lecture-body {
            display: none;
            padding: 1.5rem;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 0 0 1rem 1rem;
            margin-top: -0.5rem;
            border: 1px solid var(--glass-border);
            border-top: none;
        }

        .lecture-body.show {
            display: block;
        }

        .question-section {
            margin-bottom: 2rem;
        }

        .question-section h3 {
            font-size: 1.1rem;
            color: var(--primary);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .q-item {
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 0.8rem;
            padding: 1rem;
            border-radius: 0.75rem;
            border-left: 4px solid var(--primary);
        }

        .answer {
            color: var(--success);
            font-weight: 500;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }

        .tabs-container {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .tab-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 0.8rem 1.2rem;
            border-radius: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="exam-prep.html" class="active">Exam Prep</a>
        <a href="new.html">Management</a>
        <a href="suggestions.html">Suggestions</a>
        <a href="feedback.html">Submit Feedback</a>
        <a href="ratings-view.html">View Ratings</a>
        <a href="suggestions-view.html">View Suggestions</a>
    </nav>

    <main class="container">
        <h1>Exam Preparation Center</h1>
        <p>Select a subject to review lectures and exercises.</p>

        <div class="tabs-container">
            <button class="tab-btn active" data-tab="ehr">🩺 EHR (Lectures 1-8)</button>
            <button class="tab-btn" data-tab="ml">🤖 Machine Learning</button>
            <button class="tab-btn" data-tab="cv">👁️ Computer Vision</button>
            <button class="tab-btn" data-tab="csm">📡 CS & M</button>
            <button class="tab-btn" data-tab="dm">📊 Data Mining</button>
            <button class="tab-btn" data-tab="appdev">📱 App Development</button>
        </div>

        <div id="ehr-pane" class="content-pane">
            <div id="lecturesContainer">
                <!-- Lectures will be injected here -->
            </div>
        </div>

        <div id="other-pane" class="content-pane hidden">
            <div class="glass-card text-center">
                <p>Materials for this subject are coming soon!</p>
            </div>
        </div>
    </main>

    <script>
        // DATA MIGRATED FROM OLD EXAM-PREP.HTML
        const lectureData = {
            1: {
                title: "Lecture 1: Introduction to EHR",
                mcqs: [
                    "1. What does EHR stand for? a) Electronic Health Repository b) Electronic Health Record c) Electronic Hospital Record d) Electronic Health Reference | Answer: b",
                    "2. According to the lecture, an EHR is best described as: a) A billing system b) A digital version of patient's paper chart c) Replacement for staff d) Scheduling system | Answer: b",
                    "3. Which of the following is TYPICALLY included in an EHR? a) Patient's favorite color b) Medical history, diagnoses, medications c) Staff vacation schedules d) Hospital menu | Answer: b",
                    "4. Interoperability refers to: a) Printing speed b) Exchange of health info across systems c) Cost of system d) Color scheme | Answer: b",
                    "5. Which system is owned by a single provider? a) PHR b) EHR c) EMR d) HIS | Answer: c",
                    "6. Which record allows patient to add lifestyle data? a) EMR b) PHR c) EHR d) RIS | Answer: b",
                    "7. Advantage of EHR: a) High cost b) Improved coordination c) Cybersecurity risks d) Staff resistance | Answer: b",
                    "8. Disadvantage: a) Immediate access b) Potential cybersecurity risks c) Decision support d) Reduced errors | Answer: b",
                    "9. HIPAA is concerned with: a) Medical equipment b) Protecting patient health information c) Hospital parking d) Insurance prices | Answer: b",
                    "10. Modern standard for exchanging health info: a) ICD-10 b) CPT c) FHIR d) HTTP | Answer: c"
                ],
                truefalse: [
                    "1. EHR is a static paper chart. | False",
                    "2. EHR contains only lab results. | False",
                    "3. Patient portals allow communication with providers. | True",
                    "4. EHR concept emerged in 1960s. | True",
                    "5. EMR has high interoperability. | False"
                ],
                scenarios: [
                    "Scenario 1: Rural clinic EMR cannot share data with urban hospital – what technical reason? Answer: Lack of interoperability; EMR has limited sharing.",
                    "Scenario 2: Small clinic with limited budget, reliable internet – which EHR model? Answer: Cloud-based (low upfront, subscription)."
                ]
            },
            2: {
                title: "Lecture 2: EHR Infrastructure",
                mcqs: [
                    "1. Well-designed EHR infrastructure ensures all EXCEPT: a) High performance b) Secure data exchange c) Elimination of all hardware costs d) System continuity | Answer: c",
                    "2. Responsible for managing user access and storing patient records? a) Workstation b) Mobile device c) Server d) Switch | Answer: c",
                    "3. High CPU/memory ensure: a) Faster discharge b) Reliability for many users c) Better screen color d) Less electricity | Answer: b",
                    "4. Network connecting devices inside a single facility: a) WAN b) VPN c) LAN d) PAN | Answer: c",
                    "5. Network for multiple hospital branches: a) LAN b) WAN c) Intranet d) Bluetooth | Answer: b"
                ],
                truefalse: [
                    "1. Strong EHR infrastructure needs only hardware and databases. | False",
                    "2. Servers manage user access and store records securely. | True",
                    "3. High CPU/memory are unnecessary for EHR workstations. | False"
                ]
            },
            3: {
                title: "Lecture 3 & 4: Adoption & Standards",
                mcqs: [
                    "1. EHR replaces paper with: a) Manual filing b) Secure digital platforms c) Fax machines d) Printed summaries | Answer: b",
                    "2. Primary purpose of HL7/FHIR: a) Increase profits b) Interoperability c) Replace doctors d) Store paper | Answer: b",
                    "3. Example of international standard: a) HIPAA b) Local regulation c) HL7 d) National privacy law | Answer: c",
                    "4. Feature unique to EHR vs paper: a) Fire risk b) Instant secure sharing c) Physical storage d) Slow search | Answer: b"
                ],
                truefalse: [
                    "1. EHRs enhance efficiency, accuracy, care coordination. | True",
                    "2. Standards are optional and have no impact. | False",
                    "3. International standards like HL7 work across countries. | True"
                ]
            },
            4: {
                title: "Lecture 5: Types of EHR Systems",
                mcqs: [
                    "1. Installed on hospital's own servers: a) Cloud b) Web c) On-premises d) Mobile | Answer: c",
                    "2. On-premises advantage: a) Low cost b) Full control c) No IT d) Auto updates | Answer: b",
                    "3. Most dependent on internet: a) On-premises b) Cloud-based c) Standalone d) Paper | Answer: b",
                    "4. Cloud payment model: a) One-time license b) Subscription c) Free d) Pay-per-patient | Answer: b"
                ],
                truefalse: [
                    "1. On-premises has lower initial cost than cloud. | False",
                    "2. Cloud-based accessible anywhere with internet. | True"
                ]
            },
            5: {
                title: "Lecture 6: Functions & Core Capabilities",
                mcqs: [
                    "1. Main function of EHR: a) Billing only b) Clinical Decision Support c) Cafeteria d) Security | Answer: b",
                    "2. First/essential function: a) Results Mgmt b) Workflow c) Data Entry & Capture d) Population Health | Answer: c",
                    "3. Automatic capture from devices: a) Manual b) Forms c) Device integration d) Patient-generated | Answer: c"
                ],
                truefalse: [
                    "1. EHR replaces paper with integrated platform. | True",
                    "2. Manual data entry is only method. | False"
                ]
            },
            6: {
                title: "Lecture 7: Clinical, Administrative & Legal Integration",
                mcqs: [
                    "1. EHR role: a) Replace staff b) Accurate access + decision support c) Eliminate hospitals d) Only billing | Answer: b",
                    "2. Clinical processes: a) Org activities b) Direct patient medical activities c) Registration d) Legal | Answer: b"
                ],
                truefalse: [
                    "1. Clinical processes include registration. | False",
                    "2. Administrative processes ensure efficient operation. | True"
                ]
            },
            7: {
                title: "Lecture 8: Business Models & PM",
                mcqs: [
                    "1. Proprietary paid license model: a) Open source b) Commercial c) In-house d) Hybrid | Answer: b",
                    "2. Commercial disadvantage: a) Low cost b) Vendor lock-in c) Full customization d) No support | Answer: b"
                ],
                truefalse: [
                    "1. Commercial developed internally. | False",
                    "2. Vendor lock-in is commercial disadvantage. | True"
                ]
            }
        };

        function buildLectures() {
            const container = document.getElementById('lecturesContainer');
            for (let i = 1; i <= 7; i++) {
                const lec = lectureData[i];
                const group = document.createElement('div');
                group.className = 'lecture-group';

                let mcqHtml = '';
                lec.mcqs.forEach(q => {
                    const [text, ans] = q.split('|');
                    mcqHtml += `<div class="q-item"><strong>${text}</strong><div class="answer">✔ ${ans}</div></div>`;
                });

                let tfHtml = '';
                lec.truefalse.forEach(tf => {
                    const [text, ans] = tf.split('|');
                    tfHtml += `<div class="q-item"><strong>${text}</strong><div class="answer">Answer: ${ans}</div></div>`;
                });

                let scenarioHtml = '';
                if (lec.scenarios) {
                    lec.scenarios.forEach(s => {
                        scenarioHtml += `<div class="q-item">${s}</div>`;
                    });
                }

                group.innerHTML = `
                    <div class="lecture-header">
                        <span>📘 ${lec.title}</span>
                        <span class="icon">▼</span>
                    </div>
                    <div class="lecture-body">
                        <div class="question-section">
                            <h3>✅ Multiple Choice</h3>
                            ${mcqHtml}
                        </div>
                        <div class="question-section">
                            <h3>📌 True / False</h3>
                            ${tfHtml}
                        </div>
                        ${scenarioHtml ? `
                        <div class="question-section">
                            <h3>📖 Scenarios</h3>
                            ${scenarioHtml}
                        </div>` : ''}
                    </div>
                `;

                const header = group.querySelector('.lecture-header');
                const body = group.querySelector('.lecture-body');
                const icon = group.querySelector('.icon');

                header.addEventListener('click', () => {
                    body.classList.toggle('show');
                    icon.textContent = body.classList.contains('show') ? '▲' : '▼';
                });

                container.appendChild(group);
            }
        }

        // Tab switching
        const tabs = document.querySelectorAll('.tab-btn');
        const ehrPane = document.getElementById('ehr-pane');
        const otherPane = document.getElementById('other-pane');

        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                tabs.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                if (btn.getAttribute('data-tab') === 'ehr') {
                    ehrPane.classList.remove('hidden');
                    otherPane.classList.add('hidden');
                } else {
                    ehrPane.classList.add('hidden');
                    otherPane.classList.remove('hidden');
                }
            });
        });

        buildLectures();
    </script>
</body>
</html>
