<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Feedback - Exam Prep</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="exam-prep.html">Exam Prep</a>
        <a href="new.html" class="active">Management</a>
        <a href="suggestions.html">Suggestions</a>
        <a href="feedback.html">Submit Feedback</a>
    </nav>

    <main class="container">
        <div class="glass-card">
            <div class="header text-center">
                <h1>Quick Feedback</h1>
                <p>Upload an image and share your thoughts.</p>
            </div>

            <form id="feedbackForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="feedbackImage">📷 Upload an image (optional)</label>
                    <input type="file" id="feedbackImage" name="feedbackImage" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="feedbackText">💬 Your feedback</label>
                    <textarea id="feedbackText" name="feedbackText" placeholder="Write your thoughts here..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Feedback</button>
                <div id="message" class="text-center mt-4" style="min-height: 1.5rem;"></div>
            </form>
            
            <div class="text-center mt-4">
                <a href="new.html" style="color: var(--text-muted); text-decoration: none;">← Back to Management</a>
            </div>
        </div>
    </main>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbymC8ImcCmFrOXr4huMHJahD70YeD_TsuRL3sUPww7CDoQYu9vaojLqRymXm2M2aQBSRw/exec';

        document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = 'Submitting...';
            msgDiv.style.color = 'var(--text)';

            const formData = new FormData(e.target);
            const data = {
                type: 'quick_feedback',
                feedbackText: formData.get('feedbackText'),
                fileName: formData.get('feedbackImage') ? formData.get('feedbackImage').name : 'No file'
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(data)
                });
                msgDiv.textContent = '✓ Feedback submitted successfully!';
                msgDiv.style.color = 'var(--success)';
                e.target.reset();
            } catch (error) {
                msgDiv.textContent = '✕ Error: ' + error.message;
                msgDiv.style.color = 'var(--error)';
            }
        });
    </script>
</body>
</html>
