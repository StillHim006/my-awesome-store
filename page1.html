<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Feedback - Exam Prep</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="exam-prep.html">Exam Prep</a>
        <a href="new.html" class="active">Management</a>
        <a href="suggestions.html">Suggestions</a>
        <a href="feedback.html">Submit Feedback</a>
    </nav>

    <main class="container">
        <div class="glass-card">
            <div class="header text-center">
                <h1><span class="emoji">📸</span> Quick Feedback</h1>
                <p>Upload an image and share your thoughts.</p>
            </div>

            <form id="feedbackForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="feedbackImage">📷 Upload an image (optional)</label>
                    <input type="file" id="feedbackImage" name="feedbackImage" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="feedbackText">💬 Your feedback</label>
                    <textarea id="feedbackText" name="feedbackText" placeholder="Write your thoughts here..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Feedback</button>
                <div id="message" class="text-center mt-4" style="min-height: 1.5rem;"></div>
            </form>
            
            <div class="text-center mt-4">
                <a href="new.html" style="color: var(--text-muted); text-decoration: none;">← Back to Management</a>
            </div>
        </div>
    </main>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby13HqjWnm0zcrlfCzFdOIoDtBX6CrZewvSfKU8UXcen-6jFpA8w8JQdbA8kvNIAOc6Rg/exec';

        document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = 'Uploading... (this may take a moment)';
            msgDiv.style.color = 'var(--text)';

            const feedbackText = document.getElementById('feedbackText').value;
            const fileInput = document.getElementById('feedbackImage');
            const file = fileInput.files[0];

            const data = {
                type: 'quick_feedback',
                feedbackText: feedbackText,
                fileData: null,
                fileName: null,
                mimeType: null
            };

            if (file) {
                const base64 = await toBase64(file);
                data.fileData = base64.split(',')[1];
                data.fileName = file.name;
                data.mimeType = file.type;
            }

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(data)
                });
                msgDiv.textContent = '✓ Feedback and image saved successfully!';
                msgDiv.style.color = 'var(--success)';
                e.target.reset();
            } catch (error) {
                msgDiv.textContent = '✕ Error: ' + error.message;
                msgDiv.style.color = 'var(--error)';
            }
        });

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    </script>
</body>
</html>
