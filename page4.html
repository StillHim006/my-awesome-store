<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details - Exam Prep</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="exam-prep.html">Exam Prep</a>
        <a href="new.html" class="active">Management</a>
        <a href="suggestions.html">Suggestions</a>
        <a href="feedback.html">Submit Feedback</a>
    </nav>

    <main class="container">
        <div class="glass-card">
            <div class="header text-center">
                <h1>2 Truths & 1 lie</h1>
                <p>Save your name and up to 3 important notes.</p>
            </div>

            <form id="projectForm">
                <div class="form-group">
                    <label for="projectName">🏷️ your Name</label>
                    <input type="text" id="projectName" name="projectName" placeholder="e.g., Math Exam 2025" required>
                </div>
                <div class="form-group">
                    <label for="detail1">📌 Truth 1</label>
                    <input type="text" id="detail1" name="detail1" placeholder="Any additional info" required>
                </div>
                <div class="form-group">
                    <label for="detail2">📌 Truth 2</label>
                    <input type="text" id="detail2" name="detail2" placeholder="Another key detail" required>
                </div>
                <div class="form-group">
                    <label for="detail3">📌 Lie</label>
                    <input type="text" id="detail3" name="detail3" placeholder="Final detail" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Project</button>
                <div id="message" class="text-center mt-4" style="min-height: 1.5rem;"></div>
            </form>

            <div class="text-center mt-4">
                <a href="new.html" style="color: var(--text-muted); text-decoration: none;">← Back to Management</a>
            </div>
        </div>
    </main>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbymC8ImcCmFrOXr4huMHJahD70YeD_TsuRL3sUPww7CDoQYu9vaojLqRymXm2M2aQBSRw/exec';

        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = 'Saving...';
            msgDiv.style.color = 'var(--text)';

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.type = 'project';

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(data)
                });
                msgDiv.textContent = '✓ Project saved successfully!';
                msgDiv.style.color = 'var(--success)';
                e.target.reset();
            } catch (error) {
                msgDiv.textContent = '✕ Error: ' + error.message;
                msgDiv.style.color = 'var(--error)';
            }
        });
    </script>
</body>
</html>
