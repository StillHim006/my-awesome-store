<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Login - Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-box {
            max-width: 400px;
            margin: 6rem auto;
            padding: 2.5rem;
        }
        .error-msg {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            padding: 0.75rem;
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
            display: none;
            font-size: 0.85rem;
            text-align: center;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .loading-spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="new.html">Management Hub</a>
    </nav>

    <main class="container">
        <div class="glass-card login-box">
            <div class="text-center mb-2">
                <h2 style="margin-bottom: 0.5rem;">System Authentication</h2>
                <p style="font-size: 0.9rem;">Please enter your credentials to access the console.</p>
            </div>
            
            <div id="errorMsg" class="error-msg"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Employee ID or Username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Authenticate <div id="spinner" class="loading-spinner"></div>
                </button>
            </form>
        </div>
    </main>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbymC8ImcCmFrOXr4huMHJahD70YeD_TsuRL3sUPww7CDoQYu9vaojLqRymXm2M2aQBSRw/exec'; // REPLACE THIS

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const spinner = document.getElementById('spinner');

            errorMsg.style.display = 'none';
            spinner.style.display = 'block';

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ type: 'login', username, password })
                });
                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('admin_token', result.token);
                    window.location.href = 'view-data.html';
                } else {
                    errorMsg.textContent = result.message || 'Authentication failed';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Connection error. Verify System Endpoint.';
                errorMsg.style.display = 'block';
            } finally {
                spinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
