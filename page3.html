<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Creator - Exam Prep</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="exam-prep.html">Exam Prep</a>
        <a href="new.html" class="active">Management</a>
        <a href="suggestions.html">Suggestions</a>
        <a href="feedback.html">Submit Feedback</a>
    </nav>

    <main class="container">
        <div class="glass-card">
            <div class="header text-center">
                <h1><span class="emoji">❓</span> MCQ Creator</h1>
                <p>Build multiple-choice questions with 4 answer options.</p>
            </div>

            <form id="mcqForm">
                <div class="form-group">
                    <label for="question">📝 Question</label>
                    <input type="text" id="question" name="question" placeholder="Enter your question here" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="option1">🔹 Option 1</label>
                        <input type="text" id="option1" name="option1" placeholder="First choice" required>
                    </div>
                    <div class="form-group">
                        <label for="option2">🔸 Option 2</label>
                        <input type="text" id="option2" name="option2" placeholder="Second choice" required>
                    </div>
                    <div class="form-group">
                        <label for="option3">🔹 Option 3</label>
                        <input type="text" id="option3" name="option3" placeholder="Third choice" required>
                    </div>
                    <div class="form-group">
                        <label for="option4">🔸 Option 4</label>
                        <input type="text" id="option4" name="option4" placeholder="Fourth choice" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save MCQ</button>
                <div id="message" class="text-center mt-4" style="min-height: 1.5rem;"></div>
            </form>

            <div class="text-center mt-4">
                <a href="new.html" style="color: var(--text-muted); text-decoration: none;">← Back to Management</a>
            </div>
        </div>
    </main>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby13HqjWnm0zcrlfCzFdOIoDtBX6CrZewvSfKU8UXcen-6jFpA8w8JQdbA8kvNIAOc6Rg/exec';

        document.getElementById('mcqForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = 'Saving...';
            msgDiv.style.color = 'var(--text)';

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.type = 'mcq';

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(data)
                });
                msgDiv.textContent = '✓ MCQ saved successfully!';
                msgDiv.style.color = 'var(--success)';
                e.target.reset();
            } catch (error) {
                msgDiv.textContent = '✕ Error: ' + error.message;
                msgDiv.style.color = 'var(--error)';
            }
        });
    </script>
</body>
</html>
