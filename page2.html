<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Message - Exam Prep</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="exam-prep.html">Exam Prep</a>
        <a href="new.html" class="active">Management</a>
        <a href="suggestions.html">Suggestions</a>
        <a href="feedback.html">Submit Feedback</a>
    </nav>

    <main class="container">
        <div class="glass-card">
            <div class="header text-center">
                <h1><span class="emoji">🔒</span> Secure Message</h1>
                <p>Store confidential notes or secret messages.</p>
            </div>

            <form id="messageForm">
                <div class="form-group">
                    <label for="secretMessage">🤫 Secret message</label>
                    <textarea id="secretMessage" name="secretMessage" placeholder="Type your private note here..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Message</button>
                <div id="message" class="text-center mt-4" style="min-height: 1.5rem;"></div>
            </form>

            <div class="text-center mt-4">
                <a href="new.html" style="color: var(--text-muted); text-decoration: none;">← Back to Management</a>
            </div>
        </div>
    </main>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbymC8ImcCmFrOXr4huMHJahD70YeD_TsuRL3sUPww7CDoQYu9vaojLqRymXm2M2aQBSRw/exec';

        document.getElementById('messageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = 'Saving...';
            msgDiv.style.color = 'var(--text)';

            const secretMessage = document.getElementById('secretMessage').value;
            const data = {
                type: 'secure_message',
                secretMessage: secretMessage
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(data)
                });
                msgDiv.textContent = '✓ Message saved successfully!';
                msgDiv.style.color = 'var(--success)';
                e.target.reset();
            } catch (error) {
                msgDiv.textContent = '✕ Error: ' + error.message;
                msgDiv.style.color = 'var(--error)';
            }
        });
    </script>
</body>
</html>
